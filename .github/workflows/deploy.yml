name: Deploy Resume

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Check if src/ or scripts/ changed
        id: check_src
        run: |
          if git diff --quiet HEAD^ HEAD -- src/ scripts/; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "src/ and scripts/ unchanged, skipping resume rebuild"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "src/ or scripts/ changed, rebuilding resumes"
          fi

      - name: Build English and Chinese resumes from YAML sources
        if: steps.check_src.outputs.changed == 'true'
        run: node build.js

      - name: Commit updated resume files
        if: steps.check_src.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add resume.json resume.zh.json
          git diff --staged --quiet || git commit -m "chore: update generated resumes [skip ci]"
          git push origin HEAD

      - name: Update GitHub Gist
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
        run: node scripts/update-gist.js

      - name: Generate README
        run: node scripts/generate-readme.js

      - name: Commit updated README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "chore: update README [skip ci]"
          git push origin HEAD

      - name: Export resume to HTML
        run: |
          REPO_NAME="${GITHUB_REPOSITORY##*/}"
          pnpm exec resume export resume.html
          cp resume.json resume.json.bak
          cp resume.zh.json resume.json
          pnpm exec resume export resume.zh.html
          mv resume.json.bak resume.json
          mkdir -p dist/zh
          cp resume.html dist/index.html
          cp resume.zh.html dist/zh/index.html
          node scripts/inject-lang-switcher.js dist/index.html en zh /${REPO_NAME}/zh/
          node scripts/inject-lang-switcher.js dist/zh/index.html zh en /${REPO_NAME}/

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist

