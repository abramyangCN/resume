- name: "Christie's WeChat Miniprogram"
  description: >-
    Ongoing frontend architecture and development for Christie's China WeChat Miniprogram,
    covering complex auction, account, and cross-platform workflows.
    Tech: Taro, React, TypeScript, Redux, WebSocket, Orval, pnpm Workspaces.
  highlights:
    - "Established predictable global state management with Redux across complex auction and account workflows."
    - "Designed a WebSocket manager handling dual concurrent connections (global + local), automatic reconnection, and session recovery for reliable online auction interactions."
    - "Refactored the multi-account module to support authorized sub-account switching with per-account permission control and isolated state."
    - "Built a reusable UI component system inspired by shadcn/ui, keeping component source fully owned and customizable for product requirements."
    - "Restructured the codebase into a pnpm Workspaces monorepo supporting both WeChat Miniprogram and LINE LIFF, with shared components, utilities, and types."
    - "Introduced Orval to generate fully typed API clients from OpenAPI specifications, reducing manual contract maintenance and keeping frontend types synchronized with backend APIs."
  keywords: [Taro, React, TypeScript, Redux, WebSocket, Orval, Monorepo]
  startDate: "2023-05-01"
  roles: [Senior Frontend Engineer]
  entity: "Christie's"
  type: application

